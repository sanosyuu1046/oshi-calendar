<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fbfaf8"><title>推し活カレンダー</title>
<style>
:root{--bg:#fbfaf8;--ink:#302e2a;--muted:#8d887f;--line:#eee9e2;--accent:#b98e79;--pale:#f5ebe5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}.app{max-width:900px;margin:auto;padding:22px 16px 60px}header,.head,.event{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px}.logo{background:var(--pale);border-radius:14px;padding:12px;font-size:21px}.brand h1{font-size:19px;margin:0}.brand small{color:var(--muted);letter-spacing:.15em}.hero{margin:22px 0;background:linear-gradient(120deg,#f4e9e2,#fff);border:1px solid #eee3dc;border-radius:22px;padding:24px}.hero small{color:var(--accent);letter-spacing:.16em}.hero h2{font-size:24px;margin:8px 0}.hero p{color:#777168;font-size:13px;margin:0;line-height:1.7}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:16px 0}.stat,.card{background:white;border:1px solid var(--line);border-radius:16px;padding:14px}.stat small,.muted{font-size:11px;color:var(--muted)}.stat b{display:block;font-size:23px;margin-top:4px}.tabs{display:flex;gap:7px;overflow:auto;margin:18px 0 12px}.tab,button{border:0;border-radius:11px;padding:10px 13px;cursor:pointer}.tab{background:#efede8;color:#777}.tab.active{background:#302e2a;color:#fff}.primary{background:var(--accent);color:white}.soft{background:white;border:1px solid var(--line);color:#6f6a62}.panel{display:none}.panel.active{display:block}.head{margin:16px 0}.head h3{font-size:17px;margin:0}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:11px}.card strong{font-size:15px}.meta{font-size:12px;color:var(--muted);line-height:1.6;margin-top:6px}.pill{display:inline-block;background:var(--pale);color:#986e59;border-radius:30px;padding:4px 9px;font-size:10px;margin-top:9px}.actions{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}.tiny{font-size:11px;padding:7px 9px;background:white;border:1px solid var(--line);color:#6b665e}.empty{background:white;border:1px dashed #e5ddd4;border-radius:16px;padding:25px;text-align:center;color:var(--muted);font-size:13px}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:5px}.full{grid-column:1/-1}.field label{font-size:11px;color:var(--muted)}input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:white;color:var(--ink);font:inherit}textarea{min-height:90px}.modal{display:none;position:fixed;inset:0;background:#2228;align-items:end;justify-content:center;padding:12px}.modal.show{display:flex}.box{background:var(--bg);padding:18px;border-radius:20px;width:min(600px,100%);max-height:90vh;overflow:auto}.boxhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.boxhead h3{margin:0}.photo{max-width:100%;max-height:170px;object-fit:cover;border-radius:12px;margin-top:10px}footer{text-align:center;color:#aaa;font-size:10px;line-height:1.7;margin-top:28px}@media(max-width:500px){.app{padding:15px 12px}.form{grid-template-columns:1fr}.full{grid-column:auto}.hero h2{font-size:21px}}
</style></head><body><main class="app">
<header><div class="brand"><div class="logo">✿</div><div><h1>推し活カレンダー</h1><small>OSHI KATSU JOURNAL</small></div></div><div><button class="soft" id="backup">データ保存</button><button class="soft" id="restore">読込</button><input id="file" type="file" accept="application/json" hidden></div></header>
<section class="hero"><small>MY FAVORITE DAYS</small><h2>好きな気持ちを、ひとつずつ。</h2><p>イベントも写真も思い出も。大切な推し活の記録をここにまとめよう。</p></section>
<div class="stats"><div class="stat"><small>登録している推し</small><b id="sc">0</b></div><div class="stat"><small>これからの予定</small><b id="uc">0</b></div><div class="stat"><small>参加したイベント</small><b id="dc">0</b></div></div>
<nav class="tabs"><button class="tab active" data-tab="events">イベント</button><button class="tab" data-tab="oshi">推しリスト</button><button class="tab" data-tab="diary">思い出日記</button></nav>
<section class="panel active" id="events"><div class="head"><h3>イベント一覧</h3><button class="primary" id="newEvent">＋ イベント追加</button></div><div class="cards" id="eventList"></div></section>
<section class="panel" id="oshi"><div class="head"><h3>推しリスト</h3><button class="primary" id="newOshi">＋ 推しを追加</button></div><div class="cards" id="oshiList"></div></section>
<section class="panel" id="diary"><div class="head"><h3>思い出日記</h3><button class="primary" id="newDiary">＋ 日記を書く</button></div><div class="cards" id="diaryList"></div></section>
<footer>データはこのブラウザ内に保存されます。端末変更やブラウザのデータ削除に備えて、定期的に「データ保存」をしてください。ログイン・オンライン共有機能はまだありません。</footer>
</main><div class="modal" id="modal"><div class="box"><div class="boxhead"><h3 id="mt">追加</h3><button class="soft" id="close">閉じる</button></div><div id="mb"></div></div></div>
<script>
const KEY='oshi-calendar-white-v1',uid=()=>Math.random().toString(36).slice(2,10);
const initial=[['永田詩央里','≠ME'],['齋藤樹愛羅','=LOVE'],['さわだ','あっとほぉーむカフェ'],['ぽわわ','メイドカフェ'],['えっちゃん','メイドカフェ']].map(([name,group])=>({id:uid(),name,group}));
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{oshi:initial,events:[],diaries:[]};
const $=id=>document.getElementById(id),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}
function modal(title,html){$('mt').textContent=title;$('mb').innerHTML=html;$('modal').classList.add('show')}
function close(){ $('modal').classList.remove('show') }$('close').onclick=close;$('modal').onclick=e=>{if(e.target.id==='modal')close()};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.tab).classList.add('active')});
function options(id=''){return '<option value="">推しを選択</option>'+db.oshi.map(o=>`<option value="${o.id}" ${o.id===id?'selected':''}>${esc(o.name)}</option>`).join('')}
function photo(file,cb){if(!file){cb('');return}let r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(file)}
function localDate(){
 let d=new Date();
 return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function render(){
 let today=localDate(),changed=false;
 db.events.forEach(e=>{
  if(e.date&&e.date<today&&e.status!=='参加済み'){
   e.status='参加済み';
   changed=true;
  }
 });
 if(changed)localStorage.setItem(KEY,JSON.stringify(db));
 $('sc').textContent=db.oshi.length;
 $('uc').textContent=db.events.filter(e=>e.date>=today&&e.status!=='参加済み').length;$('dc').textContent=db.events.filter(e=>e.status==='参加済み').length;
 let ev=[...db.events].sort((a,b)=>a.date.localeCompare(b.date));
 $('eventList').innerHTML=ev.length?ev.map(e=>`<article class="card"><strong>${esc(e.title)}</strong><div class="meta">${esc(e.date)} ・ ${esc(e.oshiName)}<br>${esc(e.venue)} ・ ${esc(e.status)}</div>${e.photo?`<img class="photo" src="${e.photo}">`:''}<div class="actions"><button class="tiny" onclick="done('${e.id}')">${e.status==='参加済み'?'参加予定に戻す':'参加済みにする'}</button><button class="tiny" onclick="editEvent('${e.id}')">編集</button><button class="tiny" onclick="del('events','${e.id}')">削除</button></div></article>`).join(''):'<div class="empty">イベントはまだありません。最初の予定を登録してみよう ✿</div>';
 $('oshiList').innerHTML=db.oshi.length?db.oshi.map(o=>`<article class="card"><strong>${esc(o.name)}</strong><div class="meta">${esc(o.group)}</div>${o.memo?`<p class="meta">${esc(o.memo)}</p>`:''}<span class="pill">MY OSHI</span><div class="actions"><button class="tiny" onclick="editOshi('${o.id}')">編集</button><button class="tiny" onclick="del('oshi','${o.id}')">削除</button></div></article>`).join(''):'<div class="empty">推しを登録してみよう ✿</div>';
 $('diaryList').innerHTML=db.diaries.length?[...db.diaries].sort((a,b)=>b.date.localeCompare(a.date)).map(d=>`<article class="card"><div class="meta">${esc(d.date)} ・ ${esc(d.oshiName)}</div><strong>${esc(d.title)}</strong><p class="meta" style="white-space:pre-wrap">${esc(d.body)}</p>${d.photo?`<img class="photo" src="${d.photo}">`:''}<div class="actions"><button class="tiny" onclick="editDiary('${d.id}')">編集</button><button class="tiny" onclick="del('diaries','${d.id}')">削除</button></div></article>`).join(''):'<div class="empty">忘れたくない思い出を日記に残そう ✿</div>';
}
function eventForm(e={}){modal(e.id?'イベント編集':'イベント追加',`<form id="ef" class="form"><div class="field full"><label>イベント名</label><input name="title" required value="${esc(e.title)}" placeholder="ライブ・周年イベントなど"></div><div class="field"><label>日付</label><input name="date" type="date" required value="${esc(e.date)}"></div><div class="field"><label>推し</label><select name="oshi">${options(e.oshiId)}</select></div><div class="field full"><label>会場</label><input name="venue" value="${esc(e.venue)}"></div><div class="field"><label>参加状況</label><select name="status"><option ${e.status!=='参加済み'?'selected':''}>参加予定</option><option ${e.status==='参加済み'?'selected':''}>参加済み</option></select></div><div class="field"><label>写真</label><input name="photo" type="file" accept="image/*"></div><div class="field full"><label>メモ</label><textarea name="memo">${esc(e.memo)}</textarea></div><div class="field full"><button class="primary">保存する</button></div></form>`);
 $('ef').onsubmit=x=>{x.preventDefault();let f=x.target,old=db.events.find(z=>z.id===e.id),oid=f.oshi.value;photo(f.photo.files[0],p=>{let v={id:e.id||uid(),title:f.title.value,date:f.date.value,oshiId:oid,oshiName:db.oshi.find(o=>o.id===oid)?.name||'',venue:f.venue.value,status:f.status.value,memo:f.memo.value,photo:p||old?.photo||''};if(old)Object.assign(old,v);else db.events.push(v);close();save()})}
}
function oshiForm(o={}){modal(o.id?'推し編集':'推し追加',`<form id="of" class="form"><div class="field"><label>名前</label><input name="name" required value="${esc(o.name)}"></div><div class="field"><label>グループ・所属</label><input name="group" value="${esc(o.group)}"></div><div class="field full"><label>プロフィール・メモ</label><textarea name="memo">${esc(o.memo)}</textarea></div><div class="field full"><button class="primary">保存する</button></div></form>`);$('of').onsubmit=x=>{x.preventDefault();let f=x.target,old=db.oshi.find(z=>z.id===o.id),v={id:o.id||uid(),name:f.name.value,group:f.group.value,memo:f.memo.value};if(old)Object.assign(old,v);else db.oshi.push(v);close();save()}}
function diaryForm(d={}){modal(d.id?'日記編集':'思い出日記',`<form id="df" class="form"><div class="field"><label>日付</label><input name="date" type="date" required value="${esc(d.date||new Date().toISOString().slice(0,10))}"></div><div class="field"><label>推し</label><select name="oshi">${options(d.oshiId)}</select></div><div class="field full"><label>タイトル</label><input name="title" required value="${esc(d.title)}"></div><div class="field full"><label>日記</label><textarea name="body" required>${esc(d.body)}</textarea></div><div class="field full"><label>写真</label><input name="photo" type="file" accept="image/*"></div><div class="field full"><button class="primary">保存する</button></div></form>`);$('df').onsubmit=x=>{x.preventDefault();let f=x.target,old=db.diaries.find(z=>z.id===d.id),oid=f.oshi.value;photo(f.photo.files[0],p=>{let v={id:d.id||uid(),date:f.date.value,oshiId:oid,oshiName:db.oshi.find(o=>o.id===oid)?.name||'',title:f.title.value,body:f.body.value,photo:p||old?.photo||''};if(old)Object.assign(old,v);else db.diaries.push(v);close();save()})}}
function done(id){let e=db.events.find(x=>x.id===id);e.status=e.status==='参加済み'?'参加予定':'参加済み';save()}
function del(t,id){if(confirm('削除してもいいですか？')){db[t]=db[t].filter(x=>x.id!==id);save()}}
function editEvent(id){eventForm(db.events.find(x=>x.id===id))}function editOshi(id){oshiForm(db.oshi.find(x=>x.id===id))}function editDiary(id){diaryForm(db.diaries.find(x=>x.id===id))}
$('newEvent').onclick=()=>eventForm();$('newOshi').onclick=()=>oshiForm();$('newDiary').onclick=()=>diaryForm();
$('backup').onclick=()=>{let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'}));a.href=u;a.download='oshi-calendar-backup.json';a.click();URL.revokeObjectURL(u)};
$('restore').onclick=()=>$('file').click();$('file').onchange=e=>{let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d.oshi||!d.events||!d.diaries)throw 0;if(confirm('現在のデータを置き換えますか？')){db=d;save()}}catch{alert('バックアップを読み込めませんでした')}};if(e.target.files[0])r.readAsText(e.target.files[0])};
function photo(file,cb){
  if(!file){cb('');return}
  let r=new FileReader();
  r.onload=()=>{
    let img=new Image();
    img.onload=()=>{
      let max=1400;
      let scale=Math.min(1,max/Math.max(img.width,img.height));
      let w=Math.round(img.width*scale);
      let h=Math.round(img.height*scale);
      let c=document.createElement('canvas');
      let ctx=c.getContext('2d');
      c.width=w;
      c.height=h;
      ctx.fillStyle='#fff';
      ctx.fillRect(0,0,w,h);
      ctx.drawImage(img,0,0,w,h);
      cb(c.toDataURL('image/jpeg',0.78));
    };
    img.src=r.result;
  };
  r.readAsDataURL(file);
}
 render();
</script></body></html>
